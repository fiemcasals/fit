version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fitpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitpm_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitpm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitpm_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitpm_user} -d ${POSTGRES_DB:-fitpm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitpm_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-fitpm-super-secret-key-2026
      - DATABASE_URL=postgres://${POSTGRES_USER:-fitpm_user}:${POSTGRES_PASSWORD:-fitpm_pass}@db:5432/${POSTGRES_DB:-fitpm_db}
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitpm_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
